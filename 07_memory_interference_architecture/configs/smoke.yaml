run_name: smoke
output_root: outputs
data_file: data/dict_category_double-word_46-400_v1-1.json
seed: 7
num_keys: 3
num_updates: [1, 3]
episodes_per_level: 1
queries_per_episode: 1
candidate_batch_size: 4
candidate_metric: mean_logprob
max_boundary_shift: 0
context_safety_margin: 32
require_shared_tokenizer: true
resume: false
models:
  - name: transformer_1.3b
    architecture: softmax_transformer
    model_id: m-a-p/transformer_1.3B_baseline
    backend: hf
    requires_fla: true
    dtype: bf16
